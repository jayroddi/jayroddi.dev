<script>
(function () {
  var orig = window.fetch;
  function local(url) {
    try {
      var abs = new URL(url, location.href);
      if (abs.origin !== location.origin) return url;
      if (/^\/(habits|snaps|music|books|quote-of-the-day|assets)\//.test(abs.pathname)) {
        return new URL('../../site' + abs.pathname + abs.search, location.href).href;
      }
    } catch (e) {}
    return url;
  }
  window.fetch = function (input, init) {
    if (typeof input === 'string') input = local(input);
    else if (input && input.url) {
      var next = local(input.url);
      if (next !== input.url) input = new Request(next, input);
    }
    return orig.call(this, input, init);
  };
})();
</script>
