# Temporary /music sync only. workflow_dispatch of snaps.yml is blocked for
# this token (HTTP 403). Lightroom is not run. Removed before merge; snaps.yml
# stays the nightly path. Does not dispatch Pages. That deploy runs when the
# data lands on main.
name: Sync music once

on:
  push:
    branches: [cursor/music-cover-sync-3c07]
    paths:
      - .github/workflows/music-sync-once.yml

permissions:
  contents: write

concurrency:
  group: music-cover-sync-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync the /music playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_playlist.py site/music/playlist.json
      - name: Commit when the playlist changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/music/playlist.json
          if git diff --cached --quiet; then
            echo "music unchanged"
            exit 0
          fi
          git commit -m "Sync the music playlist."
          git push
