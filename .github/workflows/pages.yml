# Static site in site/, deployed to GitHub Pages.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # v1.61: redeploy around 12:00am CT so the share cards staged by the 11:31pm drop (og-next/) flip with the entries.
    # cron is UTC: 05:xx = midnight CDT, 06:xx = midnight CST; the extra offset is a no-op redeploy (and a retry if github runs one late).
    # :00 starts the snaps frost gate at 2026-11-01 00:00 America/Chicago. :02 and :32 retry if that run is late.
    - cron: '0,2,32 5,6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Frost cache
        uses: actions/cache@v4
        with:
          path: |
            frost-cache
            scripts/snaps_frost.json
          key: snaps-frost-${{ hashFiles('site/snaps/m/*.json', 'scripts/frost.py') }}
          restore-keys: |
            snaps-frost-
      - name: Pillow and numpy
        run: pip install pillow numpy
      - name: Snaps frost gate
        # --bake fills frost-cache/ for photos dated 2026-11-01 or later (Chicago).
        # --apply is a no-op until that midnight. after that it publishes frost JPEGs
        # for those photos only and leaves every earlier snap sharp.
        run: |
          python3 scripts/publish_snaps.py --bake
          python3 scripts/publish_snaps.py --apply
      - name: Habits (refresh cursor counts)
        # rebuilds site/habits/cursor.json from GitHub. day pages stay redirects to / unless HABITS_DAY_PAGES=1.
        # HABITS_GITHUB_TOKEN (repo scope) is optional; without it private repos are skipped and the public repo still counts.
        # a failed fetch keeps the committed cursor.json. this step never blocks the deploy.
        env:
          GH_TOKEN: ${{ github.token }}
          HABITS_GITHUB_TOKEN: ${{ secrets.HABITS_GITHUB_TOKEN }}
        run: python3 scripts/habits.py all
        continue-on-error: true
      - name: Share cards (flip at 12:00am CT)
        # copies og-next/ into site/og/ + rewrites ?d= once that date has started in chicago; a no-op otherwise, and never blocks the deploy
        run: python3 scripts/make_cards.py flip
        continue-on-error: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
