# Nightly Lightroom sync + /music playlist (spotify). Images stay on Adobe. This commits site/snaps only when the album changed.
name: Sync snaps

on:
  schedule:
    # 11:41pm America/Chicago. 04:41 UTC is 11:41pm CDT; 05:41 UTC is 11:41pm CST.
    - cron: '41 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snaps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pillow
        run: pip install pillow
      - name: Sync the album
        run: python3 scripts/sync_snaps.py
      - name: Sync the /music playlist
        continue-on-error: true   # a spotify outage never blocks the snaps sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_playlist.py site/music/playlist.json
      - name: Commit when the album changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/snaps scripts/snaps_colors.json site/music/playlist.json
          if git diff --cached --quiet; then
            echo "snaps and music unchanged"
            exit 0
          fi
          git commit -m "Sync Lightroom snaps / music playlist."
          git push
          gh workflow run pages.yml --ref main
