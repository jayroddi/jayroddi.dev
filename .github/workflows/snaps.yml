# Nightly Lightroom sync + /music playlist (spotify). Images stay on Adobe. This commits site/snaps only when the album changed.
name: Sync snaps

on:
  schedule:
    # Midnight America/Chicago, once. 05:00 UTC is midnight CDT; 06:00 UTC is midnight CST.
    # Both fire every night. The first step keeps the slot that matches the current offset
    # (CDT runs 0 5, CST runs 0 6), even if GitHub delivers the run hours late.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snaps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Only the midnight Chicago slot
        id: midnight
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual run"
            exit 0
          fi
          # The cron that queued this run, not the clock. A delivery hours late still
          # carries that cron. CDT (UTC-5) midnight is the 05:00 UTC slot; CST (UTC-6)
          # midnight is the 06:00 UTC slot. The other slot skips, including across DST.
          slot="${{ github.event.schedule }}"
          zone=$(TZ=America/Chicago date +%Z)
          if { [ "$zone" = "CDT" ] && [ "$slot" = "0 5 * * *" ]; } || { [ "$zone" = "CST" ] && [ "$slot" = "0 6 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Chicago is ${zone}; cron '${slot}' is midnight; running"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Chicago is ${zone}; cron '${slot}' is not midnight; skipping"
      - name: Checkout
        if: steps.midnight.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Pillow
        if: steps.midnight.outputs.run == 'true'
        run: pip install pillow
      - name: Sync the album
        if: steps.midnight.outputs.run == 'true'
        run: python3 scripts/sync_snaps.py
      - name: Sync the /music playlist
        if: steps.midnight.outputs.run == 'true'
        continue-on-error: true   # a spotify outage never blocks the snaps sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_playlist.py site/music/playlist.json
      - name: Commit when the album changed
        if: steps.midnight.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/snaps scripts/snaps_colors.json site/music/playlist.json
          if git diff --cached --quiet; then
            echo "snaps and music unchanged"
            exit 0
          fi
          git commit -m "Sync Lightroom snaps / music playlist."
          git push
          gh workflow run pages.yml --ref main
