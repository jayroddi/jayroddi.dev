# One-shot Lightroom sync. Removed before the snaps PR merges.
# Only a push of this file starts it, so the data commit does not run it again.
name: Sync snaps once

on:
  push:
    paths:
      - .github/workflows/snaps-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow
        run: pip install pillow
      - name: Sync the album
        run: python3 scripts/sync_snaps.py
      - name: Commit when the album changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/snaps scripts/snaps_colors.json
          if git diff --cached --quiet; then
            echo "snaps unchanged"
            exit 0
          fi
          git commit -m "Sync the Lightroom album."
          git push
