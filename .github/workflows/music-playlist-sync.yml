# One-shot /music refresh. workflow_dispatch of snaps.yml is blocked for the
# cloud-agent token (HTTP 403), so this runs the same script with the same
# repo secrets and commits site/music/playlist.json only when it changed.
# Removed before merge; snaps.yml stays the nightly path.
name: Sync music playlist

on:
  push:
    branches: [cursor/music-playlist-sync-3c07]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync the /music playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_playlist.py site/music/playlist.json
      - name: Commit playlist when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/music/playlist.json
          if git diff --cached --quiet; then
            echo "music unchanged"
            exit 0
          fi
          git commit -m "Sync music playlist."
          git push
