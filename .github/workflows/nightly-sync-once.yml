# Temporary full nightly sync: the same Lightroom album step and Spotify
# playlist step as snaps.yml. workflow_dispatch of snaps.yml is blocked for
# this token (HTTP 403). Removed before merge; snaps.yml stays the nightly path.
# Does not dispatch Pages. That deploy runs when the data lands on main.
name: Nightly snaps and music

on:
  push:
    branches: [cursor/nightly-snaps-music-3c07]

permissions:
  contents: write

concurrency:
  group: nightly-snaps-music-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pillow
        run: pip install pillow
      - name: Sync the album
        run: python3 scripts/sync_snaps.py
      - name: Sync the /music playlist
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_playlist.py site/music/playlist.json
      - name: Commit when the album or playlist changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/snaps scripts/snaps_colors.json site/music/playlist.json
          if git diff --cached --quiet; then
            echo "snaps and music unchanged"
            exit 0
          fi
          git commit -m "Sync Lightroom snaps / music playlist."
          git push
