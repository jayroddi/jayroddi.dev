name = "jay-snap-guesses"
main = "worker.js"
compatibility_date = "2026-10-30"

# Free Cloudflare account. From this directory:
#   npx wrangler login
#   npx wrangler kv namespace create GUESSES
# Paste the printed id below. The binding name has to stay GUESSES.
#   npx wrangler secret put READ_TOKEN
#   npx wrangler deploy
# Then set GUESS_URL in site/snaps/snaps.js to the https://….workers.dev URL
# (or a custom domain on this worker) and deploy the site. No write token
# goes in client JS. READ_TOKEN is only for reading the log.
[[kv_namespaces]]
binding = "GUESSES"
id = "REPLACE_ME"
