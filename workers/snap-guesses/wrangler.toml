name = "jay-snap-guesses"
main = "worker.js"
compatibility_date = "2026-10-30"

# Free Cloudflare account. From this directory:
#   npx wrangler login
#   npx wrangler kv namespace create GUESSES
# Paste the printed id below. The binding name has to stay GUESSES.
#   npx wrangler secret put READ_TOKEN
#   npx wrangler deploy
# The snaps page does not call this worker. READ_TOKEN is only for reading the log.
[[kv_namespaces]]
binding = "GUESSES"
id = "REPLACE_ME"
