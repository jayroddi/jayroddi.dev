<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="color-scheme" content="dark">
<script>document.documentElement.classList.add('js')</script>
<title>share card</title>
<link rel="stylesheet" href="/habits/habits.css?v=2.22">
<link rel="stylesheet" href="/assets/rain.css?v=2.19">
<script src="/assets/rain.js?v=2.18"></script>
<link rel="stylesheet" href="/assets/foot.css?v=1.97">
<script src="/assets/foot.js?v=2.69" defer></script>
<style>
  /* card frame only. the header, social row, email field, rocket, and konami row keep the live rules. */
  html{color-scheme:dark}
  html,body.board{width:1200px;height:630px;min-height:630px;max-height:630px;overflow:hidden}
  body.board{display:flex;flex-direction:column}
  body.board .stage{flex:1 1 auto;min-height:0;align-items:stretch;padding-bottom:0}
  body.board .copy{flex:1 1 auto;min-height:0;align-self:stretch}
  .lyrics{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;min-height:0;margin:0;padding:0}
  .lyrics p{margin:0;font-family:var(--mono);font-size:26px;font-weight:400;line-height:1.55;letter-spacing:normal;color:var(--ink);white-space:nowrap;text-align:center}
  /* freeze the ninja on the bright half of nj-pulse so the still shows the speed-colour glow */
  .social .nj{animation-delay:-.525s;animation-play-state:paused}
  .tap-hint{display:none!important}
  /* the live footer reserves a tall bottom pad for a scrolling page. keep the rows, sit them inside 630. */
  body.board .foot{padding:4px 0 22px;min-height:0}
  body.board .signup{margin:10px auto 4px}
  body.board .pad{margin-top:10px}
  .notify .cbl-w .flow{animation:none;opacity:0}
  .notify:not(.ok) .rkb .rk{animation-delay:-2.2s;animation-play-state:paused}
</style>
</head>
<body class="board">
<div class="glows" aria-hidden="true">
  <div class="glow" style="right:-260px;top:calc(50vh - 460px);width:1100px;height:900px;background:radial-gradient(closest-side,rgba(26,173,179,.10),rgba(26,173,179,.03) 55%,rgba(26,173,179,0))"></div>
  <div class="glow" style="left:-340px;top:calc(100vh - 380px);width:1000px;height:700px;background:radial-gradient(closest-side,rgba(26,173,179,.12),rgba(26,173,179,0))"></div>
</div>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<main class="stage" id="stage">
  <h1 class="visually-hidden">jay tha ninja habits</h1>
  <div class="copy">
    <header class="mast"><p class="line"></p></header>
    <div class="lyrics"><!--LYRICS--></div>
  </div>
</main>
<!--FOOTER-->
<script src="/habits/habits.js?v=2.16"></script>
<script src="/assets/signup.js?v=2.21" defer></script>
</body>
</html>
