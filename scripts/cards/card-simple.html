<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- v3.3 (jay 2026.10.23): the one share card for every page. the site's own teal rain (rain.css + rain.js) on black, the header line centered, white, 44px. the shorter line fits at the original size. -->
<meta name="viewport" content="width=1200, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/habits/habits.css">
<link rel="stylesheet" href="/assets/rain.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
.card p{margin:0;font-family:var(--mono);font-size:44px;font-weight:500;font-style:italic;letter-spacing:normal;line-height:1.25;color:#fff;text-align:center;white-space:nowrap;text-shadow:0 0 18px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.9)}
</style>
</head>
<body class="board">
<canvas id="rain" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="card"><p>100% human // living out loud</p></div>
<script src="/assets/rain.js"></script>
<script>
// the same rain the snaps page builds (snaps.js), full height, glyphs behind the line fade like they do behind page content
const T = [26, 173, 179], PALE_TEAL = [121, 205, 207];
const rain = JayRain.Rain(document.getElementById('rain'), {
  fs: 16, fsMobile: 13, mono: '"JetBrains Mono", monospace', seed: 5, head: [255, 255, 255], headMix: .6,
  tint: T, paleTint: PALE_TEAL, paleOrange: [255, 150, 121],
  palette: (x, w, r) => r < .84 ? T : PALE_TEAL,
  bands: (w, H) => [{y0: 0, y1: H, perCol: 2.1, lenMin: 8, lenMax: 30, alpha: .56, stepMin: 60, stepMax: 170, colDensity: () => 1}],
  alphaAt: () => 1,
  partSel: '.card p', partPad: 50, partFloor: .25
});
JayRain.register(rain);
document.fonts.ready.then(() => { rain.build(); requestAnimationFrame(rain.frame); });
</script>
</body>
</html>
