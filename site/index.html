:root{
  --bg:#000; --ink:#f6efe9; --ink-2:rgba(246,239,233,.72); --ink-3:rgba(246,239,233,.5);
  --orange:#FF4D1A; --teal:#1AADB3; --white:#fff;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;font-style:normal}
html{background:var(--bg);touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;min-height:100vh;min-height:100svh}
a{color:var(--c);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--c)}
::selection{background:var(--c);color:#021213}
.glows{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(14px)}
#rain{position:absolute;left:0;top:0;width:100%;z-index:1;pointer-events:none}
.scan{position:fixed;inset:0;z-index:30;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(235,250,250,.026) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:screen;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}

.stage{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:clamp(48px,8vh,96px) 0 clamp(56px,9vh,100px)}
:root{--fs:18px}
@media (max-width:760px){:root{--fs:14px}}
.copy{margin-left:var(--left);width:var(--col);font-size:var(--fs);text-shadow:0 0 8px rgba(var(--bg-rgb),.8)}
.hello{font-size:21px;line-height:1.4;color:var(--c)}
:root{--pgap:32px;--sec-a:31.5px;--sec-b:119.5px}
@media (max-width:760px){:root{--pgap:20px;--sec-a:18px;--sec-b:72.5px}}
@media (min-width:761px) and (max-height:700px){:root{--pgap:20px;--sec-a:20.5px;--sec-b:72.5px}}
.paras{margin-top:0}
.js [data-static]{visibility:hidden}
.ns-links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--fs);line-height:1.5}.ns-links a{color:var(--f)}
.para{font-size:var(--fs);line-height:1.7;color:var(--white);white-space:pre-line}
.para + .para{margin-top:var(--pgap)}
.para a{white-space:nowrap}
.para .bold{font-weight:700;color:var(--white)}
.para .teal,.prompt .teal{color:var(--c);white-space:nowrap}
@media (max-width:340px){.para .teal,.prompt .teal,.para a{white-space:normal}}
.spamcan{--spam-body:#1AADB3;--spam-body-edge:#0B5B5E;--spam-rim:#F2B632;--spam-rim-edge:#6E4A06;--spam-ink:#021213}
.spamcan.is-orange,:root[data-mode="fast"] .spamcan{--spam-body:#FF4D1A;--spam-body-edge:#8A2208;--spam-ink:#2A0A02}
.spamcan.is-gold,:root[data-mode] .gld .spamcan,:root[data-mode] .spamcan.gld,:root[data-mode].gld .spamcan,:root[data-mode] .cta:has(.notify.gold-ok) .spamcan{--spam-body:#FFD700;--spam-body-edge:#7A5C00;--spam-rim:#FFFBE8;--spam-rim-edge:#7A5C00;--spam-ink:#5A4300}
@media (prefers-color-scheme:light){
  .spamcan{--spam-body:#0E7C81;--spam-body-edge:#064346;--spam-ink:#fff}
  .spamcan.is-orange,:root[data-mode="fast"] .spamcan{--spam-ink:#2A0A02}
  .spamcan.is-gold,:root[data-mode] .gld .spamcan,:root[data-mode] .spamcan.gld,:root[data-mode].gld .spamcan,:root[data-mode] .cta:has(.notify.gold-ok) .spamcan{--spam-body:#E0B400;--spam-body-edge:#7A5C00;--spam-ink:#3D2E00}
}
.sig{margin-top:22px;font-size:20px;line-height:1.5;color:var(--c)}
.sig .ninja{display:inline-block;height:1.45em;width:1.45em;margin-left:.08em;vertical-align:-.38em;opacity:0;transform:scale(.4) translateY(6px);transition:opacity .28s ease-out,transform .42s cubic-bezier(.34,1.56,.64,1)}
.sig .ninja.in{opacity:1;transform:none}
.cta{margin-top:var(--pgap);font-size:var(--fs);line-height:1.5}
.prompt{color:var(--white);line-height:1.7}
.prompt + .prompt{margin-top:20px}
.prompt{text-wrap:balance}
.prompt .w{white-space:nowrap}.prompt .c{display:inline-block;position:relative}
.prompt .c.fall{color:var(--fg);text-shadow:0 0 8px rgba(var(--fg-rgb),var(--gk)),0 0 20px rgba(var(--fg-rgb),calc(.65*var(--gk)))}
.prompt .tr{color:rgba(var(--fg-rgb),.72);text-shadow:0 0 10px rgba(var(--fg-rgb),calc(.4*var(--gk)))}
.prompt .c.land{animation:prompt-land 1.1s ease-out}
@keyframes prompt-land{0%{text-shadow:0 0 10px rgba(var(--fg-rgb),var(--gk)),0 0 22px rgba(var(--fg-rgb),calc(.95*var(--gk)))}100%{text-shadow:0 0 8px rgba(var(--bg-rgb),.8)}}
.signup{position:relative}
.signup .col{position:absolute;left:0;top:0;margin:-.625em 0 0 -.3em;line-height:1.25;white-space:pre;pointer-events:none;z-index:2;color:var(--c-hot);text-shadow:0 0 8px rgba(var(--c-rgb),.95),0 0 20px rgba(var(--c-rgb),.7)}
.signup .col.teal{color:var(--c-hot);text-shadow:0 0 8px rgba(var(--c-rgb),.95),0 0 20px rgba(var(--c-rgb),.7)}
.signup .col.teal .tr{color:var(--c);text-shadow:0 0 10px rgba(var(--c-rgb),.55)}
.js .notify.rainin{transition:none}
.notify.rainin > input[type=email]:not(.landed),.notify.rainin > .rkb:not(.landed){visibility:hidden}
.notify.rainin > input[type=email].landed:not(.now){animation:in-land 1.1s ease-out}
@keyframes in-land{0%{border-bottom-color:var(--fg);box-shadow:0 1px 0 rgba(var(--fg-rgb),var(--gk)),0 10px 22px -8px rgba(var(--c-rgb),1)}100%{box-shadow:0 0 0 rgba(var(--c-rgb),0)}}
.notify.rainin > .rkb.landed:not(.now){animation:rk-land 1.1s ease-out}
@keyframes rk-land{0%{filter:drop-shadow(0 0 6px rgba(var(--fg-rgb),var(--gk))) drop-shadow(0 0 14px rgba(var(--c-rgb),.95))}100%{filter:drop-shadow(0 0 0 rgba(var(--c-rgb),0))}}
.signup{display:grid;grid-template-columns:minmax(0,1fr);margin-top:6px}
.signup > *{grid-area:1/1}
.notify{display:flex;min-width:0;align-items:baseline;gap:18px;transition:opacity .45s ease-out,transform .5s cubic-bezier(.22,1,.36,1),visibility 0s}
.js .notify{opacity:0;transform:translateY(6px);visibility:hidden}
.js .notify.in{opacity:1;transform:none;visibility:visible}
.js .notify.gone{opacity:0;transform:translateY(-4px);visibility:hidden;transition:opacity .2s ease-in,transform .2s ease-in,visibility 0s .2s}

const reEgg = () => { if (!state.egg) buildEgg(); else if (state.egg === 'landed') eggSettle(); };
const newest = (all, ok, day) => (Array.isArray(all) ? all : []).filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && ok(e) && (e.live || e.date) <= day).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0)[0];
const PICK = {
  quote: (all, day) => { const t = newest(all, e => e.quote, day); return t ? {date: t.date, text: t.quote} : null; },
  song: (all, day) => { const t = newest(all, e => typeof e.lyric === 'string' && e.lyric.trim(), day); return t ? {date: t.date, text: t.lyric} : null; },
  recap: (all, day) => { const t = newest(all, e => typeof e.text === 'string' && e.text.trim(), day); return t && (t.live ? t.live === day : t.date === day || t.date === dayBefore(day)) ? t.text : ''; },
  snap: (all, day) => { const t = newest(all, e => typeof (e.home || e.src) === 'string' && (e.home || e.src), day); return t && (t.date === day || t.date === dayBefore(day)) ? {src: t.home || t.src, alt: String(t.alt || '')} : null; }
};
function applyQuote(q, src){
  const body = lc(q); state.quote = {src, text: body || quoteLine.body};
  if (!body || body === quoteLine.body) return;
  quoteLine.body = body; reEgg();
}
function applySong(text, src){
  const body = lc(text); state.song = {src, text: body || songLine.body};
  if (!body || body === songLine.body) return;
  songLine.body = body; reEgg();
}
function applyDay(d, src){
  const body = /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d.replace(/-/g, '.') : String(d || ''); state.day = {src, text: body || dayLine.body};
  if (!body || body === dayLine.body) return;
  dayLine.body = body; reEgg();
}
const cached = k => { try { const c = JSON.parse(ssGet(k) || 'null'); return c && c.day === chiDay() ? c : null; } catch (e) { return null; } };
const cache = (k, v) => { try { store && store.setItem(k, JSON.stringify(Object.assign({day: chiDay()}, v))); } catch (e) {} };
{ const c = cached('jtn.quote'); if (c && c.quote) applyQuote(c.quote, 'session'); }
{ const c = cached('jtn.song'); if (c && c.lyric) applySong(c.lyric, 'session'); }
{ const c = cached('jtn.dd'); applyDay(c && c.date || chiDay(), c ? 'session' : 'guess'); }
if (!state.quote) state.quote = {src: 'fallback', text: quoteLine.body};
if (!state.song) state.song = {src: 'fallback', text: songLine.body};
buildEgg();
const quoteReady = getJSON(COPY.eggData).then(all => { const q = PICK.quote(all, chiDay()); if (!q) return null; cache('jtn.quote', {quote: q.text}); applyQuote(q.text, 'quotes.json'); return q.date; }).catch(() => { state.quoteError = true; return undefined; });
const songReady = getJSON(COPY.songData).then(all => { const q = PICK.song(all, chiDay()); if (!q) return null; cache('jtn.song', {lyric: q.text}); applySong(q.text, 'songs.json'); return q.date; }).catch(() => { state.songError = true; return undefined; });
const dayReady = Promise.all([songReady, quoteReady]).then(ds => {
  const known = ds.filter(d => typeof d === 'string');
  if (!known.length){ if (ds.every(d => d === undefined)) applyDay(COPY.dayDate, 'fallback'); return; }
  const d = known.sort().pop(); cache('jtn.dd', {date: d}); applyDay(d, 'json');
});
function applyRecap(text, src){
  const body = lc(text); state.recap = {src, text: body};
  if (body === recapLine.body) return;
  recapLine.body = body; reEgg();
}
{ const c = cached('jtn.recap'); if (c) applyRecap(c.text || '', 'session'); }
const recapReady = getJSON(COPY.recapData).then(all => { const text = PICK.recap(all, chiDay()); cache('jtn.recap', {text}); applyRecap(text, 'recaps.json'); }).catch(() => { state.recapError = true; });
function applySnap(e, src){
  const body = e ? COPY.snapText : ''; state.snap = {src, on: !!e};
  if (e && (!snapData || snapData.src !== e.src)){ snapData = e; snapImg.alt = e.alt || ''; snapImg.src = e.src; } else if (!e) snapData = null;
  if (body === snapLine.body) return;
  snapLine.body = body; reEgg();
}
{ const c = cached('jtn.snap'); if (c) applySnap(c.snap || null, 'session'); }
const snapReady = getJSON(COPY.snapData).then(all => { const snap = PICK.snap(all, chiDay()); cache('jtn.snap', {snap}); applySnap(snap, 'snaps.json'); }).catch(() => { state.snapError = true; });
if (window.JayRain && JayRain.newDay) JayRain.newDay(async day => {
  const got = await Promise.allSettled([COPY.eggData, COPY.songData, COPY.recapData, COPY.snapData].map(getJSON));
  const val = (i, pick) => got[i].status === 'fulfilled' ? {v: pick(got[i].value, day)} : null;
  const q = val(0, PICK.quote), s = val(1, PICK.song), r = val(2, PICK.recap), p = val(3, PICK.snap);
  if ((r && !!lc(r.v) !== !!recapLine.body) || (p && !!p.v !== !!snapLine.body)){ location.reload(); return; }
  if (p && p.v && (!snapData || snapData.src !== p.v.src)){ const im = new Image(); im.src = p.v.src; try { await im.decode(); } catch (e) {} }
  if (q && q.v){ cache('jtn.quote', {quote: q.v.text}); applyQuote(q.v.text, 'midnight'); }
  if (s && s.v){ cache('jtn.song', {lyric: s.v.text}); applySong(s.v.text, 'midnight'); }
  const d = [q && q.v && q.v.date, s && s.v && s.v.date].filter(Boolean).sort().pop(); if (d){ cache('jtn.dd', {date: d}); applyDay(d, 'midnight'); }
  if (r){ cache('jtn.recap', {text: r.v}); applyRecap(r.v, 'midnight'); }
  if (p){ cache('jtn.snap', {snap: p.v}); applySnap(p.v, 'midnight'); }
  state.newDay = {day, at: Date.now()};
});

lines.forEach(t => render(t, 0, TIMING.window));
cursor.remove();
lines[0].runs[0].node.insertBefore(cursor, lines[0].runs[0].ghost);
if (cameBack) complete();
const copyEl = document.querySelector('.copy'); if (!cameBack && copyEl) copyEl.style.visibility = 'hidden';
Promise.all([document.fonts.ready, Promise.race([Promise.all([recapReady, snapReady, dayReady]), new Promise(r => setTimeout(r, TIMING.recapWait))])]).then(() => { fitEgg(true); if (copyEl) copyEl.style.visibility = '';
  rain.build(); requestAnimationFrame(rain.frame); if (cameBack) return; if (reduced){ skip(); } else intro(); });
let lastW = innerWidth, rt; addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => { fitEgg(); rain.build(); }, 150); });
addEventListener('orientationchange', () => setTimeout(() => fitEgg(), 250));
addEventListener('resize', () => fitSnap());
if (window.ResizeObserver){ let ro; new ResizeObserver(() => { clearTimeout(ro); ro = setTimeout(() => fitEgg(), 120); }).observe(eggEl); }
})();
